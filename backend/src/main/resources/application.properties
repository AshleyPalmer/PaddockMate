spring.application.name=paddockmate-backend

# Database Connection (matches docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5433/paddockmate
spring.datasource.username=paddockmate
spring.datasource.password=paddockmate
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server Port
server.port=8080
